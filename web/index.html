<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Call Calendar</title>
    <link rel="stylesheet" href="/web/styles.css" />
  </head>
  <body>
    <main class="booking-page">
      <section class="hero" aria-label="Intro">
        <p class="hero-kicker">Call Calendar</p>
        <h1>Book polished meetings in seconds</h1>
        <p class="hero-subtitle">
          Pick a date, adjust meeting defaults, and confirm your slot with an interface designed for speed.
        </p>
      </section>
      <section class="top-controls" aria-label="Display controls">
        <button id="overlay-toggle" class="toggle" type="button" role="switch" aria-checked="true" aria-label="Overlay my calendar">
          <span class="toggle-knob"></span>
        </button>
        <span class="control-label">Overlay my calendar</span>
        <button id="settings-button" class="icon-btn" type="button" aria-label="Settings">⚙</button>
        <button class="icon-btn is-active" type="button" aria-label="Calendar view" data-view="calendar">📅</button>
        <button class="icon-btn" type="button" aria-label="Grid view" data-view="grid">▦</button>
        <button class="icon-btn" type="button" aria-label="Columns view" data-view="columns">☰</button>
      </section>

      <section class="booking-card" aria-label="Booking card">
        <aside class="meeting-info">
          <div class="organizer">
            <div class="avatar" id="colleague-avatar" aria-hidden="true">K</div>
            <label class="organizer-select-wrap" for="colleague-select">
              <span class="organizer-label">Colleague</span>
              <select id="colleague-select" class="organizer-select" aria-label="Select colleague"></select>
            </label>
          </div>
          <h1 id="meeting-title">30 Min Meeting</h1>
          <div class="meeting-meta-controls">
            <label for="meeting-duration-select">🕒 Duration</label>
            <select id="meeting-duration-select" aria-label="Meeting duration"></select>

            <label for="meeting-provider-select">🎥 Provider</label>
            <select id="meeting-provider-select" aria-label="Meeting provider"></select>

            <label for="meeting-timezone-select">🌐 Timezone</label>
            <select id="meeting-timezone-select" aria-label="Meeting timezone"></select>
          </div>
        </aside>

        <section class="calendar-panel" aria-label="Calendar panel">
          <header class="calendar-header">
            <h2 id="month-label">April 2026</h2>
            <div class="month-nav">
              <button id="prev-month" type="button" aria-label="Previous month">‹</button>
              <button id="next-month" type="button" aria-label="Next month">›</button>
            </div>
          </header>
          <div class="weekdays" aria-hidden="true">
            <span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span><span>SUN</span>
          </div>
          <div id="calendar-grid" class="calendar-grid" role="grid" aria-label="Calendar"></div>
        </section>

        <section class="slots-panel" aria-label="Available time slots">
          <header class="slots-header">
            <h3 id="selected-date-label">Select date</h3>
            <div class="format-toggle" role="group" aria-label="Time format">
              <button id="format-12h" type="button" aria-pressed="false">12h</button>
              <button id="format-24h" type="button" class="is-active" aria-pressed="true">24h</button>
            </div>
          </header>
          <div class="slots-scroll" aria-label="Available time options">
            <div id="slot-list" class="slot-list"></div>
            <p id="slot-empty" class="slot-empty" hidden>No available times</p>
          </div>

          <form id="booking-form" class="booking-form">
            <label>Customer name <input id="customer_name" type="text" minlength="2" required /></label>
            <label>Customer email <input id="customer_email" type="email" required /></label>
            <button id="book-button" type="submit" class="book-button">Book selected slot</button>
          </form>
          <p id="booking-result" class="slot-empty" aria-live="polite"></p>
        </section>
      </section>

      <p class="brand">Call Calendar</p>
    </main>

    <script>
      window.APP_CONFIG = { API_BASE_URL: '/api' };
    </script>
    <script src="/web/app.js" type="module"></script>
  </body>
</html>
