<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Call Calendar</title>
    <link rel="stylesheet" href="/web/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Call Calendar</h1>
      <section>
        <h2>Create booking</h2>
        <form id="booking-form">
          <label>
            Slot start (ISO datetime)
            <input id="slot_start" type="text" placeholder="2026-06-01T10:00:00" required />
          </label>
          <label>
            Customer name
            <input id="customer_name" type="text" minlength="2" required />
          </label>
          <label>
            Customer email
            <input id="customer_email" type="email" required />
          </label>
          <button type="submit">Book slot</button>
        </form>
        <p id="create-result" aria-live="polite"></p>
      </section>

      <section>
        <h2>Upcoming bookings</h2>
        <button id="refresh-upcoming" type="button">Refresh</button>
        <ul id="upcoming-list"></ul>
      </section>
    </main>

    <script>
      window.APP_CONFIG = {
        API_BASE_URL: '/api',
      };
    </script>
    <script src="/web/app.js" type="module"></script>
  </body>
</html>
